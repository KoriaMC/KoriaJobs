# CI/CD KoriaJobs : compile le plugin à chaque push / pull request et publie les .jar.
#  - chaque build : les .jar sont dans l'onglet Actions (artefact "KoriaJobs")
#  - push sur la branche par défaut : release "latest" mise à jour avec le .jar
#  - tag v* (ex. v1.2.0) : release versionnée avec le .jar
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer KoriaJobs
        uses: actions/checkout@v4
        with:
          path: KoriaJobs

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: KoriaJobs/pom.xml

      - name: Compiler KoriaJobs
        run: mvn -B -ntp clean package -DskipTests
        working-directory: KoriaJobs

      - name: Préparer les .jar
        run: |
          mkdir -p dist
          find KoriaJobs/target -maxdepth 1 -name '*.jar' ! -name 'original-*' -exec cp {} dist/ \;
          ls -l dist

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: KoriaJobs
          path: dist/*.jar
          if-no-files-found: error

      - name: Release "latest" (branche par défaut)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar --target "$GITHUB_SHA" --latest \
            --title "KoriaJobs - dernière version" \
            --notes "Build automatique de la branche $GITHUB_REF_NAME (commit ${GITHUB_SHA::7})."

      - name: Release versionnée (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --title "KoriaJobs $GITHUB_REF_NAME" --generate-notes
